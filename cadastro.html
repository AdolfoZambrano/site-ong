<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Sites ONG</title>
 <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Cadastro de Colaboradores</h1>
  </header>
  <nav>
    <a href="index.html">Início</a>
    <a href="projetos.html">Projetos</a>
    <a href="cadastro.html">Cadastro</a>
  </nav>
  <main>
    <section>
      <h2>Faça seu cadastro</h2>
      <p>Preencha os dados abaixo para colaborar com a ONG.</p>
      <div class="alerta">
       Preencha todos os campos obrigatórios antes de enviar o cadastro.
      </div>
      <form>
       <div class="form-grid">
        <fieldset>
          <legend>Dados pessoais</legend>
          <label for="nome">Nome completo:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            required
          >
          
          <label for="email">E-mail:</label>
          <input
            type="email"
            id="email"
            name="email"
            required
          >
          
          <label for="nascimento">Data de nascimento:</label>
          <input
            type="date"
            id="nascimento"
            name="nascimento"
            required
          >
          
          <label for="cpf">CPF:</label>
          <input
            type="text"
            id="cpf"
            name="cpf"
            placeholder="000.000.000-00"
            maxlength="14"
            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
            title="Digite o CPF no formato 000.000.000-00"
            required
          >
          
          <label for="telefone">Telefone:</label>
          <input
            type="text"
            id="telefone"
            name="telefone"
            placeholder="(00) 00000-0000"
            maxlength="15"
            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
            title="Digite o telefone no formato (00) 00000-0000"
            required
          >
        </fieldset>
        
        <fieldset>
          <legend>Endereço</legend>
          <label for="cep">CEP:</label>
          <input
            type="text"
            id="cep"
            name="cep"
            placeholder="00000-000"
            maxlength="9"
            pattern="[0-9]{5}-[0-9]{3}"
            title="Digite o CEP no formato 00000-000"
            required
          >
          
          <label for="endereco">Endereço:</label>
          <input
            type="text"
            id="endereco"
            name="endereco"
            required
          >
          
          <label for="cidade">Cidade:</label>
          <input
            type="text"
            id="cidade"
            name="cidade"
            required
          >
          
          <label for="estado">Estado:</label>
          <input
            type="text"
            id="estado"
            name="estado"
            maxlength="2"
            placeholder="PR"
            required
          >
        </fieldset>
       </div>
        
        <button type="submit">Enviar</button>
      </form>
     <div class="toast">
      ✓ Cadastro enviado com sucesso!
     </div>
    </section>
  </main>
  <footer>
    <p>Sites ONG - Projeto acadêmico</p>
  </footer>
</body>
</html>
